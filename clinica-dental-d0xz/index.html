<style>

*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}

.tag{background:#ffd666;color:#5a4300;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.lang[hidden]{display:none}.lang{display:flex;border:1px solid #fff8;border-radius:99px;overflow:hidden}

main{max-width:1180px;margin:0 auto;padding:16px}
h2{font-size:17px;margin:22px 0 10px}

.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}.grid.chat{grid-template-columns:400px 1fr}}
.panel{background:var(--card);border-radius:16px;box-shadow:0 2px 10px #0001;overflow:hidden;display:flex;flex-direction:column}
.panel>.hd{padding:12px 14px;border-bottom:1px solid #eee;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}

.wa-top{background:var(--wa);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}

.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;

.stats{display:flex;gap:10px;padding:12px 14px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:#f6f8f7;border-radius:12px;padding:10px;text-align:center}

footer{text-align:center;color:var(--mute);font-size:12.5px;padding:20px}
/* modo video */
.video header .lang,.video #sec2,.video footer,.video .ctrl,.video .rules{display:none}
.still *{animation:none!important}.video main{padding:10px}.video h2{margin:6px 0 8px}
</style>

const qs = new URLSearchParams(location.search);
let L = qs.get("lang") || D.defaultLang;
if (qs.get("video")) document.body.classList.add("video");
if (qs.has("step")) document.body.classList.add("still");
const t = k => (D.ui[k] && (D.ui[k][L] || D.ui[k].es)) || "";
const tx = o => o[L] || o.es;
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\*(.+?)\*/g,"<b>$1</b>").replace(/(\s)_([^_\n]+)_(?=\s|$)/g,"$1<i>$2</i>");
const $ = id => document.getElementById(id);
let timers = [], step = 0;

function paintUI(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.title = t("title");
  $("rules").innerHTML = (D.ui.rules[L]||D.ui.rules.es).map(r=>"<li>"+r+"</li>").join("");
  if (D.bilingual){ $("lang").hidden = false; $("lang").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.l===L)); }
  renderInbox();
}
function bubble(ev){
  const m = $("msgs"), f = $("feed");
  if (ev.t.startsWith("owner")) {
    const e = f.querySelector(".empty"); if (e) e.remove();
    const c = document.createElement("div");
    c.className = "card " + (ev.t==="owner_alerta"?"alerta":ev.t==="owner_llamada"?"llamada":"");
    c.innerHTML = esc(tx(ev)); f.prepend(c); return;
  }
  const b = document.createElement("div"); b.className = "b " + ev.t;
  if (ev.t==="img") b.innerHTML = '<div class="ph">📷</div><small>'+esc(tx(ev))+'</small>';
  else b.innerHTML = (ev.t==="bot"?'<span class="lb">🤖 '+t("botLabel")+'</span>':"") + esc(tx(ev));
  m.appendChild(b); m.scrollTop = m.scrollHeight;
}
function reset(){ timers.forEach(clearTimeout); timers=[]; step=0; $("msgs").innerHTML=""; $("feed").innerHTML='<div class="empty">'+t("empty")+'</div>'; }
function play(fast){
  reset();
  const n = qs.has("step") ? +qs.get("step") : (fast ? D.chat.length : 0);
  for (; step < n && step < D.chat.length; step++) bubble(D.chat[step]);
  $("msgs").scrollTop = 1e6;
  if (qs.has("step") || fast) return;
  let acc = 400;
  for (let i = step; i < D.chat.length; i++){
    const ev = D.chat[i];
    const wait = ev.t==="bot" ? 1300 : ev.t==="sys" ? 700 : 1000;
    if (ev.t==="bot") timers.push(setTimeout(()=>{const ty=document.createElement("div");ty.className="typing";ty.id="ty";ty.textContent="•••";$("msgs").appendChild(ty);$("msgs").scrollTop=1e6;}, acc));
    acc += wait;
    timers.push(setTimeout(()=>{const ty=$("ty"); if(ty) ty.remove(); bubble(ev); step=i+1;}, acc));
  }
}
function quick(kind){
  bubble({t:"cli", es:t(kind)});
  timers.push(setTimeout(()=>{ bubble({t:"bot", es:t(kind+"Reply")}); bubble({t:"owner_llamada", es:t(kind+"Owner")}); }, 700));
}
function renderInbox(){
  const R = D.results; let u=0;
  $("inbox").innerHTML = R.map(r=>{ if(r.urgente) u++;
    const res = L==="en" && r.en ? r.en : (r.texto || r.es);
    return `<div class="row ${r.urgente?"":"filt"}"><div class="ic">${D.labels[r.categoria][0]}</div><div class="bd">
     <div class="tp"><b>${r.de}</b><span>${r.hora} <span class="pill ${r.urgente?"u":"f"}">${r.urgente?t("pillU"):t("pillF")}</span></span></div>
     <div class="tx">${r.tipo==="audio"?"🎙️ ":""}${esc(res)}</div>
     <div class="mt">${t("cat")}: ${D.labels[r.categoria][L==="en"?2:1]} · ${t("score")}: ${r.puntaje} · ${esc(r.motivo)}</div></div></div>`}).join("");
  $("sT").textContent=R.length; $("sU").textContent=u; $("sF").textContent=R.length-u;
  $("aviso").innerHTML = esc(D.aviso[L] || D.aviso.es);
}
$("replay").onclick = ()=>{ qs.delete("step"); play(false); };
$("skip").onclick = ()=>{ qs.delete("step"); play(true); };
$("qCall").onclick = ()=>quick("call");
$("qHuman").onclick = ()=>quick("human");
$("why").onclick = ()=>$("inboxPanel").classList.toggle("showwhy");
$("lang").querySelectorAll("button").forEach(b=>b.onclick=()=>{ L=b.dataset.l; paintUI(); play(true); });
paintUI(); play(false);
</script>
